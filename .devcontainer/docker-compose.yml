services:
  php-app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    ports:
      - "9081:80"

    environment:
      SSH_AUTH_SOCK: /ssh-agent
      # Debe coincidir con el puerto publicado en `ports`.
      SITE_PUBLIC_PORT: "9081"

    # Generado en el host por initializeCommand; contiene su IP de la LAN.
    env_file:
      - host.env

    volumes:
      # Código del motor (working copy de desarrollo).
      - ..:/PHPSiteEngine

      # Raíz del sitio Apache: persiste al reconstruir el contenedor.
      - php-app-data:/var/www/html



      # Artificial Intelligence
      - /workspace/shared/claude/dir:/home/vscode/.claude:rw
      # Shadow the conversations: license/settings stay shared, transcripts stay per-workspace.
      - /workspace/shared/claude/wptheme:/home/vscode/.claude/projects:rw
      - /workspace/shared/openai/codex:/home/vscode/.codex:rw

      # SSH & GIT
      - ${HOME}/.ssh/ssh-agent.sock:/ssh-agent
      - ${HOME}/.ssh/id_ed25519.pub:/home/vscode/.ssh/id_ed25519.pub:ro
      - ${HOME}/.ssh/known_hosts:/home/vscode/.ssh/known_hosts:rw
      - ${HOME}/.gitconfig:/home/vscode/.gitconfig:ro
      - /workspace/shared/git/hooks:/home/vscode/git-hooks:ro

    depends_on:
      db:
        condition: service_healthy

    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: mariadb:11

    environment:
      MARIADB_DATABASE: app
      MARIADB_USER: app
      MARIADB_PASSWORD: app
      MARIADB_ROOT_PASSWORD: root

    volumes:
      - db-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  php-app-data:
  db-data:
